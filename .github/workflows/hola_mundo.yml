name: Aprendiendo GitHub Actions & Triggering Workflows
run-name: ¡Estoy aprendiendo GitHub Actions + Triggering Workflows!
on: 
  push:
    branches:
      - aprendiendo-github-actions
    paths:
      - '**.py'
      - '**.yaml'
  schedule:
    - cron: '30 5,17 * * *'

jobs:
  hola-mundo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Definir variable
        run: echo "USERNAME=${{ github.actor }}" >> $GITHUB_ENV
      - name: Correr script
        run: python hola_mundo.py
